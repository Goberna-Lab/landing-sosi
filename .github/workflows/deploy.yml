name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sosi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps2-sosi]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - name: Guard dist + rsync local al docroot
        run: |
          set -euo pipefail
          DOCROOT=/home/sosiaspilcueta/web/sosiaspilcueta.com/public_html
          [ -n "$(find dist -mindepth 1 -type f -print -quit)" ] || { echo "::error::dist/ vacio -> abort"; exit 1; }
          sudo rsync -rl --delete --chmod=D755,F644 dist/ "$DOCROOT/"
          echo "deploy OK -> $DOCROOT"
